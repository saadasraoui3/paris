services:
  app:
    build: .
    container_name: clemence-paris-app
    ports:
      - "8003:80"
    env_file: .env
    environment:
      APP_URL: http://localhost:8003
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: clemence_paris
      DB_USERNAME: clemence
      DB_PASSWORD: secret
    volumes:
      - storage-data:/var/www/html/storage/app
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: clemence-paris-db
    environment:
      MYSQL_DATABASE: clemence_paris
      MYSQL_USER: clemence
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: clemence-paris-phpmyadmin
    ports:
      - "8004:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 100M
    depends_on:
      - db

volumes:
  db-data:
  storage-data:
